name: Revalidate next 7 days of liturgies

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 in America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-future-liturgies
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test future liturgy source and formatting
        run: node --test scripts/future-liturgy-format.test.mjs scripts/generate-future-liturgies.test.mjs
      - name: Revalidate and repair next 7 days
        id: generate
        continue-on-error: true
        env:
          DAYS_AHEAD: "7"
        run: node scripts/generate-future-liturgies.mjs --refresh-existing
      - name: Commit new or corrected pages
        run: |
          if [[ -z "$(git status --porcelain liturgia-content)" ]]; then
            echo "No liturgy changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liturgia-content/*.mdx
          git commit -m "Revalida liturgias dos próximos 7 dias"
          git push
      - name: Report source failures
        if: steps.generate.outcome == 'failure'
        run: exit 1
